<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natalia Silva · Portfólio</title>
<!-- Versão do portfólio com valores, para enviar às marcas que pedem orçamento.
     Ela carrega o portfólio público (index.html) e acrescenta os preços de valores.js,
     então tudo que mudar no portfólio aparece aqui também. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5e1414">
<style>body{margin:0;background:#a8967e}</style>
</head>
<body>
<script>
fetch("./index.html", { cache: "no-cache" })
  .then((r) => r.text())
  .then((html) => {
    html = html
      .replace("</head>", '<meta name="robots" content="noindex, nofollow">\n</head>')
      .replace(/<\/body>(?![\s\S]*<\/body>)/, '<script src="valores.js"><\/script>\n</body>');
    document.open();
    document.write(html);
    document.close();
  });
</script>
</body>
</html>
